[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.78"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cmake = "0.1"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"

tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"

# Native Soura audio engine.
# CPAL gives us native CoreAudio/WASAPI/etc. output rather than WebAudio.
cpal = "0.17.3"

# Native Rust wrapper around Signalsmith Stretch.
signalsmith-stretch = "0.1.3"
crossbeam-queue = "0.3"

# Keep the actual DSP optimized even while the surrounding Tauri app is
# running under `cargo run` / `npx tauri dev`. Signalsmith's own docs warn
# that unoptimized builds can be dramatically slower.
[profile.dev.package."signalsmith-stretch"]
opt-level = 3

[profile.dev.package.cpal]
opt-level = 2
