<!doctype html>
<html class="streaming-is-booting" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Discover music releases, radio, and live streams from Melogic Records creators through Melogic Streaming."
    />
    <link rel="canonical" href="https://melogicrecords.com/streaming" />
    <title>Melogic Streaming | Music and Live Streams</title>
  <style id="streaming-critical-boot-style">
  html.streaming-is-booting #app { visibility: hidden !important; }
  #streaming-first-paint {
    position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center;
    background: #000;
  }
  #streaming-first-paint img { width: 72px; height: 72px; object-fit: contain; }
  html.streaming-is-booting #page-preloader { z-index: 2147483640 !important; }
</style>
    <!-- Melogic browser / installed-app identity -->
    <link rel="icon" href="/branding/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/branding/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/branding/icons/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/branding/icons/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#050505" />
  </head>
  <body>
    <div id="streaming-first-paint" class="streaming-first-paint" role="status" aria-label="Loading Melogic Streaming">
      <img src="/src/assets/brand/melogic-logo-mark-white-transparent.png" alt="" />
    </div>
    <style>
      html,body{background:#000}
      .streaming-first-paint{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:#000}
      .streaming-first-paint img{width:78px;height:auto;display:block;animation:streamingFirstPaintPulse 1.35s ease-in-out infinite}
      @keyframes streamingFirstPaintPulse{0%,100%{opacity:.58;transform:scale(.94)}50%{opacity:1;transform:scale(1)}}
      @media (prefers-reduced-motion:reduce){.streaming-first-paint img{animation:none}}
    </style>
    <div id="app"></div>
    <script type="module" src="/src/music.js"></script>
  </body>
</html>
