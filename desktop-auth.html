<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer"><meta name="robots" content="noindex">
  <title>Connect Origami — Melogic</title>
  <link rel="stylesheet" href="/src/styles/desktopAuth.css">
</head>
<body><main>
  <p class="brand">MELOGIC / ORIGAMI</p>
  <h1>Connect your account</h1>
  <p id="status" role="status">Checking your Melogic session…</p>
  <p id="identity"></p>
  <p id="verification"></p>
  <p class="notice">Continue only if you started this request in Origami and the verification code matches. This signs in the desktop app; it does not grant a license.</p>
  <div><button id="approve" disabled>CONNECT ORIGAMI</button><button id="cancel" disabled>CANCEL</button></div>
  <a href="/profile">Open Melogic account</a>
</main><script type="module" src="/src/desktopAuth.js"></script></body>
</html>
