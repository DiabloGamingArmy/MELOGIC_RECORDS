<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer"><meta name="robots" content="noindex">
  <title>Connect Origami — Melogic</title>
  <link rel="stylesheet" href="/src/styles/desktopAuth.css">
</head>
<body><main>
  <p class="brand">MELOGIC / ORIGAMI</p>
  <section id="consent" hidden>
    <h1>Connect your Melogic Account to Origami?</h1>
    <p id="identity"><span id="account-name"></span><span id="account-email"></span></p>
    <p class="notice">Origami will use your Melogic Account to verify your product access.</p>
    <div class="actions"><button id="approve" disabled>CONNECT</button><button id="cancel" disabled>DECLINE</button></div>
  </section>
  <section id="completed" hidden>
    <div id="success-icon" hidden aria-hidden="true"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="14"/><path d="m9 16 5 5 9-10"/></svg></div>
    <h1 id="result-title"></h1><p id="result-copy"></p>
  </section>
  <p id="status" role="status" aria-live="polite">Checking your Melogic session…</p>
</main><script type="module" src="/src/desktopAuth.js"></script></body>
</html>
