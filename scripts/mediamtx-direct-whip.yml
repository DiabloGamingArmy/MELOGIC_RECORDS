logLevel: info

# Detailed 1080p screen shares can arrive in bursts. Keep enough queue and UDP
# socket headroom to absorb an IDR frame without fragmenting large datagrams.
readTimeout: 20s
writeTimeout: 20s
writeQueueSize: 2048
udpMaxPayloadSize: 1200

rtsp: true
rtspAddress: :8554
rtspTransports: [tcp]
rtmp: false
srt: false
playback: false

api: true
apiAddress: :9997

hls: true
hlsAddress: :8888
hlsAllowOrigins: ["https://melogicrecords.studio", "https://melogic-records.web.app"]
hlsAlwaysRemux: false
hlsVariant: fmp4
hlsSegmentCount: 45
hlsSegmentDuration: 4s
hlsPartDuration: 500ms
hlsSegmentMaxSize: 80M
hlsMuxerCloseAfter: 60s

webrtc: true
webrtcAddress: :8889
webrtcAllowOrigins: ["https://melogicrecords.studio", "https://melogic-records.web.app"]
# Browser broadcasts favor continuity over sub-second ingest latency. The
# previous UDP path showed sustained FU-A loss during detailed 1080p screen
# shares, permanently dropping H.264 frames before HLS could buffer them.
# ICE-TCP retransmits those packets; the intentionally delayed HLS player
# absorbs the extra transport latency.
webrtcLocalUDPAddress: ""
webrtcLocalTCPAddress: :8000
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts: [35.188.101.63]

paths:
  "~^ingest/([A-Za-z0-9_-]+)$":
    source: publisher
    overridePublisher: false
    # WebRTC supplies H.264 + Opus. Copy H.264 without a generation loss and
    # convert only audio to high-quality AAC-LC for native Safari HLS. Repeating
    # SPS/PPS on keyframes lets a viewer join at any HLS segment boundary.
    runOnReady: >-
      ffmpeg -nostdin -hide_banner -loglevel warning
      -thread_queue_size 8192 -rtsp_transport tcp -i rtsp://127.0.0.1:$RTSP_PORT/ingest/$G1
      -map 0:v? -map 0:a?
      -c:v copy -bsf:v dump_extra=freq=keyframe
      -c:a aac -profile:a aac_low -aac_coder fast -b:a 192k -ar 48000 -ac 2
      -af aresample=async=1000:min_hard_comp=0.1:first_pts=0,asetpts=N/SR/TB
      -max_muxing_queue_size 4096
      -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:$RTSP_PORT/$G1
    runOnReadyRestart: true

  "~^([A-Za-z0-9_-]+)$":
    source: publisher
    overridePublisher: false
