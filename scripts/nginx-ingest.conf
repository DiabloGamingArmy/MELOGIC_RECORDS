server {
    server_name ingest.melogicrecords.studio;

    # Backward compatibility for Studio tabs that loaded before the direct
    # MediaMTX cutover. Keep accepting the former SRS WHIP URL, but rewrite its
    # stream query parameter into MediaMTX's path-based WHIP endpoint. Existing
    # SRS WHEP readers continue through the broader /rtc/ location below.
    location = /rtc/v1/whip/ {
        if ($arg_stream !~ "^[A-Za-z0-9_-]{25}$") {
            return 400;
        }

        rewrite ^/rtc/v1/whip/$ /ingest/$arg_stream/whip break;
        proxy_pass http://10.128.0.2:8889;
        proxy_http_version 1.1;
        proxy_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect ~^http://10\.128\.0\.2:8889/(.*)$ https://ingest.melogicrecords.studio/mtx/$1;
        proxy_redirect ~^/(.*)$ /mtx/$1;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;

        add_header Access-Control-Allow-Origin "https://melogicrecords.studio" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Origin, Referer, Accept, If-Match" always;
        add_header Access-Control-Expose-Headers "Location, Link, ETag, Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location /rtc/ {
        proxy_pass http://127.0.0.1:1985/rtc/;
        proxy_http_version 1.1;

        # SRS emits permissive CORS headers on successful WHIP responses.
        # Hide them so browsers receive one unambiguous origin policy.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Request-Private-Network;

        add_header Access-Control-Allow-Origin "https://melogicrecords.studio" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Origin, Referer, Accept" always;
        add_header Access-Control-Expose-Headers "Location, Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # New browser broadcasts publish straight to MediaMTX on the standby
    # streaming VM. Signaling stays on this TLS origin; the SDP answer advertises
    # the worker's public UDP candidate so media does not traverse this proxy.
    location /mtx/ {
        proxy_pass http://10.128.0.2:8889/;
        proxy_http_version 1.1;
        proxy_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect ~^http://10\.128\.0\.2:8889/(.*)$ https://ingest.melogicrecords.studio/mtx/$1;
        proxy_redirect ~^/(.*)$ /mtx/$1;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;

        add_header Access-Control-Allow-Origin "https://melogicrecords.studio" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Origin, Referer, Accept, If-Match" always;
        add_header Access-Control-Expose-Headers "Location, Link, ETag, Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Browser publishers remain on SRS WHIP, but their HLS output is generated
    # by MediaMTX from SRS WHEP. This avoids SRS 6's corrupt RTC-to-RTMP clock
    # conversion while retaining one HTTPS origin for signaling and playback.
    location /hls/ {
        # Prefer the direct WebRTC worker. A stream created before this cutover
        # still lives on the local legacy relay, so a 404 falls through without
        # changing its public playback URL.
        proxy_pass http://10.128.0.2:8888/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_intercept_errors on;
        error_page 404 502 503 504 = @legacy_hls;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect ~^/(.*)$ /hls/$1;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;

        add_header Access-Control-Allow-Origin "https://melogicrecords.studio" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Accept, Range, Cache-Control" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Content-Type, Date" always;
        add_header Cache-Control "private, no-cache" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location @legacy_hls {
        rewrite ^/hls/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect ~^/(.*)$ /hls/$1;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;

        add_header Access-Control-Allow-Origin "https://melogicrecords.studio" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Accept, Range, Cache-Control" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Content-Type, Date" always;
        add_header Cache-Control "private, no-cache" always;
    }

    location / {
        return 404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ingest.melogicrecords.studio/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ingest.melogicrecords.studio/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = ingest.melogicrecords.studio) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name ingest.melogicrecords.studio;
    return 404; # managed by Certbot
}
