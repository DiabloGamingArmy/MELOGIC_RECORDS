server {
    server_name ingest.melogicrecords.studio;

    location /rtc/ {
        proxy_pass http://127.0.0.1:1985/rtc/;
        proxy_http_version 1.1;

        # SRS emits permissive CORS headers on successful WHIP responses.
        # Hide them so browsers receive one unambiguous origin policy.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Request-Private-Network;

        add_header Access-Control-Allow-Origin "https://melogicrecords.studio" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Origin, Referer, Accept" always;
        add_header Access-Control-Expose-Headers "Location, Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Browser publishers remain on SRS WHIP, but their HLS output is generated
    # by MediaMTX from SRS WHEP. This avoids SRS 6's corrupt RTC-to-RTMP clock
    # conversion while retaining one HTTPS origin for signaling and playback.
    location /hls/ {
        proxy_pass http://127.0.0.1:8888/;
        proxy_http_version 1.1;
        proxy_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect ~^/(.*)$ /hls/$1;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;

        add_header Access-Control-Allow-Origin "https://melogicrecords.studio" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Accept, Range, Cache-Control" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Content-Type, Date" always;
        add_header Cache-Control "private, no-cache" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location / {
        return 404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ingest.melogicrecords.studio/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ingest.melogicrecords.studio/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = ingest.melogicrecords.studio) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name ingest.melogicrecords.studio;
    return 404; # managed by Certbot
}
